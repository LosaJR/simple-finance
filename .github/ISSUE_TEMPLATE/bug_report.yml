name: Bug privado de tester
description: Reportar un problema sin incluir datos financieros reales.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "No incluyas importes reales, comercios sensibles, capturas con datos personales ni exportaciones financieras."
  - type: textarea
    id: what-happened
    attributes:
      label: Que ha pasado
      description: Describe el problema con datos ficticios si hace falta.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Dispositivo, sistema y navegador
      placeholder: "iPhone 15, iOS 18.6, Safari"
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Versión visible de Simple Finance
      description: "Mírala junto a la marca en Inicio; por ejemplo, v1.13."
      placeholder: "v1.13"
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Cómo abriste la app
      options:
        - PWA instalada desde la pantalla de inicio
        - Safari o navegador móvil
        - Navegador de escritorio
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      placeholder: "1. Abrir la app\n2. Usar solo datos ficticios\n3. Indicar fecha y día de cobro configurado si afecta a un ciclo"
    validations:
      required: true
  - type: textarea
    id: expected-observed
    attributes:
      label: Resultado esperado y resultado observado
      placeholder: "Esperaba…\nOcurrió…"
    validations:
      required: true
  - type: textarea
    id: cycle-context
    attributes:
      label: Contexto de ciclo (solo si aplica)
      description: "Día de cobro configurado, fechas ficticias usadas y ciclo mostrado."
      placeholder: "Cobro: día 1. Fechas de prueba: 02/07 y 30/07. Ciclo mostrado: agosto."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: "Confirmo que no he incluido datos financieros reales, datos personales ni exportaciones."
          required: true
